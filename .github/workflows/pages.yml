name: Deploy site to GitHub Pages

# Builds the PUBLIC site as static HTML from data/published/snapshots.json and
# publishes it to the gh-pages branch (Settings → Pages → Deploy from a branch → gh-pages / root).
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Scheduled publications: the editor can date an update up to 14 days ahead. The build
  # holds such entries back; this daily run puts each one live on its date (00:07 Kyiv
  # in winter, 01:07 in summer).
  schedule:
    - cron: "7 22 * * *"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # On the daily schedule, rebuild only if an entry's date is today or yesterday in Kyiv
  # (yesterday covers a delayed or skipped run).
  due:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node -e '
            const f = require("./data/published/snapshots.json");
            const kyiv = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Kyiv" }).format(d);
            const today = kyiv(new Date()), yesterday = kyiv(new Date(Date.now() - 864e5));
            const due = f.snapshots.some((s) => s.data.asOfDate === today || s.data.asOfDate === yesterday);
            console.log(`today ${today}: ${due ? "scheduled entry due" : "nothing scheduled"}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `run=${due}\n`);
          '

  deploy:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static site
        # Default address: https://<owner>.github.io/<repo>/.
        # Own (sub)domain: set the repository variable PAGES_DOMAIN, e.g. crimes.imi.org.ua.
        # Then the site is built for the domain root and out/CNAME is written, so the
        # forced push to gh-pages keeps the custom domain instead of wiping it.
        env:
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
          NEXT_PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$PAGES_DOMAIN" ]; then
            export BASE_PATH="" SITE_URL="https://$PAGES_DOMAIN"
          else
            export BASE_PATH="/$REPO" SITE_URL="https://$OWNER.github.io/$REPO"
          fi
          npm run build:static
          if [ -n "$PAGES_DOMAIN" ]; then echo "$PAGES_DOMAIN" > out/CNAME; fi
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
      - name: Publish to gh-pages branch
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Summary
        run: echo "Site → $SITE_URL/" >> "$GITHUB_STEP_SUMMARY"
